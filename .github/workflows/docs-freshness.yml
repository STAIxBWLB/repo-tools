name: docs-freshness

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a resolved workflow commit
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ -n "$WORKFLOW_REPOSITORY" && "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: repo-tools
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Warn if documentation evidence is stale or invalid
        run: |
          if ! node repo-tools/bin/check-docs.mjs caller --committed --require-fresh --json; then
            echo '::warning::Documentation evidence is stale or invalid. Run check-docs --committed --require-fresh locally for details.'
          fi
